name: CHIMERA

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: lint + typecheck + tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: chimera
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install runtime + dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pytest>=8.0" "pytest-asyncio>=0.23" "hypothesis>=6.98" "ruff>=0.4" "mypy>=1.10"

      - name: Ruff lint
        run: ruff check .

      - name: Mypy (strict)
        run: mypy core conftest.py

      - name: Pytest (default suite; integration runs on macOS — see below)
        run: python -m pytest -q

  integration:
    # Real UNIX-socket + organ-spawn tests. Linux is fine for sockets; the
    # suite is the same one that runs locally, minus macOS-only organs.
    name: integration suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: chimera
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install runtime + dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pytest>=8.0" "pytest-asyncio>=0.23" "hypothesis>=6.98"

      - name: Pytest (integration)
        run: python -m pytest -m integration -q
