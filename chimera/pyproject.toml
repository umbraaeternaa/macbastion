[project]
name = "chimera"
version = "0.2.0-alpha"
description = "Privacy and security organism for macOS"
readme = "../README.md"
requires-python = "~=3.13.0"
license = { text = "MIT" }
authors = [
    { name = "Andranik Khachatryan", email = "" }
]

dependencies = [
    "cryptography>=42.0",
    "ollama>=0.6.2",
    "pydantic>=2.6",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.98",
    "ruff>=0.4",
    "mypy>=1.10",
    "pyinstaller>=6.20", # build-time only: freeze core to a signed Mach-O (Slice 2b prereq)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["core", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "S",   # bandit (security)
    "ANN", # type annotations
    "ASYNC", # async best practices
]
ignore = [
    "S101",    # assert used (we use it in tests)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "S101", "S105", "S603", "S607"]  # tests: skip strict typing; subprocess + fake secrets are trusted
"modules/oracle/tests/*" = ["ANN", "S101", "S105", "S603", "S607"]  # oracle unit tests, same policy as tests/*
"modules/pulse/tests/*" = ["ANN", "S101", "S105", "S603", "S607"]  # pulse unit tests, same policy as tests/*

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests", "modules/oracle/tests", "modules/pulse/tests"]
pythonpath = ["modules/oracle", "modules/pulse"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
markers = [
    "integration: spawns the chaff binary against a live core (slow; deselected by default — run with `pytest -m integration`)",
    "ollama: hits a real local Ollama server (llama3.2:1b); opt-in, deselected by default (run with `pytest -m ollama`)",
]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-v",
    "-m",
    "not integration",
]
